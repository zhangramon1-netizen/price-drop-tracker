# A GitHub Actions workflow: instructions GitHub runs automatically on its own computers.
name: CI

# WHEN to run: on every pull request, and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest # a fresh, empty Linux machine GitHub lends us
    steps:
      - uses: actions/checkout@v4 # copy our repo's code onto that machine
      - uses: actions/setup-node@v4 # install Node.js there
        with:
          node-version: 22
      - run: npm test # run our tests; if any fail, the check turns red
